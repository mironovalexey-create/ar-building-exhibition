<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#151515">
<title>Выборгская — планы здания</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171717;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{-webkit-user-select:none;user-select:none}
#app{height:100%;height:100dvh;display:flex;flex-direction:column}
header{height:64px;flex:0 0 64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #333;background:#151515;z-index:20}
.title{font-size:18px;font-weight:600}.sub{opacity:.55;font-size:13px;margin-left:10px}
.controls{display:flex;gap:7px;align-items:center}
button{appearance:none;-webkit-appearance:none;border:1px solid #444;background:#242424;color:#eee;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px;min-width:40px;height:38px}
button:active{background:#444;transform:scale(.97)}
#stage{position:relative;flex:1;overflow:hidden;touch-action:none;background:#f7f7f7;cursor:grab;overscroll-behavior:none}
#stage.dragging{cursor:grabbing}
#canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.page{position:absolute;left:0;top:0;display:none}
.page.active{display:block}
.page img{display:block;position:absolute;left:0;top:0;width:100%;height:100%;object-fit:fill;pointer-events:none;-webkit-user-drag:none}
#pager{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:7px 10px;background:rgba(20,20,20,.92);border-radius:12px;border:1px solid #444;z-index:30}
#pageName{min-width:90px;text-align:center;font-size:14px}
#counter{opacity:.65;font-size:12px}
#hint{position:absolute;right:14px;bottom:18px;background:rgba(20,20,20,.75);padding:8px 10px;border-radius:8px;font-size:11px;opacity:.75;z-index:5}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f7f7f7;color:#222;font-size:14px;z-index:4}
@media(max-width:700px){
 header{height:54px;flex-basis:54px;padding:0 8px}
 .title{font-size:15px}.sub{display:none}
 .controls{gap:4px}
 button{padding:6px 8px;min-width:36px;height:36px;font-size:13px}
 #pager{bottom:max(10px,env(safe-area-inset-bottom));gap:6px}
 #pageName{min-width:72px;font-size:13px}
}
@media(max-width:390px){
 .title{display:none}
 button{min-width:34px;padding:5px 6px}
}
</style>
</head>
<body>
<div id="app">
<header>
  <div><span class="title">ВЫБОРГСКАЯ</span><span class="sub">планы одного здания</span></div>
  <div class="controls">
    <button id="prev" type="button" aria-label="Предыдущий план">←</button>
    <button id="next" type="button" aria-label="Следующий план">→</button>
    <button id="fit" type="button">FIT</button>
    <button id="minus" type="button" aria-label="Уменьшить">−</button>
    <button id="plus" type="button" aria-label="Увеличить">+</button>
    <button id="full" type="button" aria-label="Полный экран">⛶</button>
  </div>
</header>

<div id="stage">
  <div id="loading">Загрузка плана…</div>
  <div id="canvas">
    <div id="page1" class="page active"><img id="img1" src="plans/1.svg" alt="План 1 этажа" draggable="false"></div>
    <div id="page2" class="page"><img id="img2" src="plans/6.svg" alt="План 6 этажа" draggable="false"></div>
  </div>
  <div id="hint">1 палец — перемещение · 2 пальца — масштаб</div>
  <div id="pager">
    <button id="pPrev" type="button">←</button>
    <div id="pageName">1 этаж</div>
    <div id="counter">1 / 2</div>
    <button id="pNext" type="button">→</button>
  </div>
</div>
</div>

<script>
(function(){
"use strict";

const stage=document.getElementById("stage");
const canvas=document.getElementById("canvas");
const loading=document.getElementById("loading");
const pages=[
  {el:document.getElementById("page1"), img:document.getElementById("img1"), name:"1 этаж"},
  {el:document.getElementById("page2"), img:document.getElementById("img2"), name:"6 этаж"}
];

let current=0, scale=1, x=0, y=0;
let baseW=1000, baseH=1000;
let dragging=false, lastX=0, lastY=0;
let touchMode=null, touchStartX=0, touchStartY=0, lastTouchX=0, lastTouchY=0;
let startDistance=0, startScale=1, startMidX=0, startMidY=0;
let moved=false;

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
function midpoint(a,b){return {x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2};}

function apply(){
  canvas.style.transform="translate3d("+x+"px,"+y+"px,0) scale("+scale+")";
}

function fit(){
  const sw=stage.clientWidth, sh=stage.clientHeight;
  scale=Math.min(sw/baseW,sh/baseH)*0.96;
  if(!isFinite(scale)||scale<=0) scale=0.001;
  x=(sw-baseW*scale)/2;
  y=(sh-baseH*scale)/2;
  apply();
}

function zoomAt(factor,cx,cy){
  const old=scale;
  const next=clamp(old*factor,0.00005,100);
  if(next===old)return;
  const wx=(cx-x)/old, wy=(cy-y)/old;
  scale=next;
  x=cx-wx*scale;
  y=cy-wy*scale;
  apply();
}

function zoomCenter(factor){
  zoomAt(factor,stage.clientWidth/2,stage.clientHeight/2);
}

function showPage(i){
  current=(i+pages.length)%pages.length;
  pages.forEach((p,n)=>p.el.classList.toggle("active",n===current));
  document.getElementById("pageName").textContent=pages[current].name;
  document.getElementById("counter").textContent=(current+1)+" / "+pages.length;
  fit();
}

function loadSize(img){
  return new Promise(resolve=>{
    if(img.complete && img.naturalWidth){
      resolve();
      return;
    }
    img.addEventListener("load",resolve,{once:true});
    img.addEventListener("error",()=>resolve(),{once:true});
  });
}

async function init(){
  await Promise.all(pages.map(p=>loadSize(p.img)));
  // SVGs are kept as separate vector files. Their viewBox proportions are used
  // indirectly through the browser's intrinsic SVG rendering dimensions.
  const img=pages[0].img;
  const nw=img.naturalWidth||1000, nh=img.naturalHeight||1000;
  const ratio=nw/nh;
  baseW=1000;
  baseH=1000/ratio;
  pages.forEach(p=>{
    p.el.style.width=baseW+"px";
    p.el.style.height=baseH+"px";
    p.img.style.width=baseW+"px";
    p.img.style.height=baseH+"px";
  });
  loading.style.display="none";
  showPage(0);
}
init();

document.getElementById("prev").addEventListener("click",()=>showPage(current-1));
document.getElementById("next").addEventListener("click",()=>showPage(current+1));
document.getElementById("pPrev").addEventListener("click",()=>showPage(current-1));
document.getElementById("pNext").addEventListener("click",()=>showPage(current+1));
document.getElementById("fit").addEventListener("click",fit);
document.getElementById("minus").addEventListener("click",()=>zoomCenter(0.8));
document.getElementById("plus").addEventListener("click",()=>zoomCenter(1.25));

document.getElementById("full").addEventListener("click",async()=>{
  try{
    if(document.fullscreenElement){
      await document.exitFullscreen();
    }else if(stage.requestFullscreen){
      await stage.requestFullscreen();
    }else if(document.webkitFullscreenElement){
      document.webkitExitFullscreen && document.webkitExitFullscreen();
    }else if(stage.webkitRequestFullscreen){
      stage.webkitRequestFullscreen();
    }
  }catch(e){}
});

// Desktop mouse
stage.addEventListener("mousedown",e=>{
  if(e.button!==0)return;
  dragging=true;moved=false;lastX=e.clientX;lastY=e.clientY;
  stage.classList.add("dragging");
});
window.addEventListener("mousemove",e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  if(Math.abs(dx)+Math.abs(dy)>2)moved=true;
  x+=dx;y+=dy;lastX=e.clientX;lastY=e.clientY;apply();
});
window.addEventListener("mouseup",()=>{
  dragging=false;stage.classList.remove("dragging");
});
stage.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=stage.getBoundingClientRect();
  zoomAt(e.deltaY<0?1.12:0.89,e.clientX-r.left,e.clientY-r.top);
},{passive:false});

// iOS / touch
function touchCenter(ts){
  const a=ts[0],b=ts[1];
  return midpoint(a,b);
}
stage.addEventListener("touchstart",e=>{
  e.preventDefault();
  moved=false;
  if(e.touches.length===1){
    touchMode="pan";
    touchStartX=lastTouchX=e.touches[0].clientX;
    touchStartY=lastTouchY=e.touches[0].clientY;
  }else if(e.touches.length>=2){
    touchMode="pinch";
    startDistance=dist(e.touches[0],e.touches[1]);
    startScale=scale;
    const r=stage.getBoundingClientRect(),m=touchCenter(e.touches);
    startMidX=m.x-r.left;startMidY=m.y-r.top;
  }
},{passive:false});

stage.addEventListener("touchmove",e=>{
  e.preventDefault();
  if(e.touches.length>=2){
    if(touchMode!=="pinch"){
      touchMode="pinch";
      startDistance=dist(e.touches[0],e.touches[1]);
      startScale=scale;
    }
    const d=dist(e.touches[0],e.touches[1]);
    if(startDistance>0){
      const factor=d/startDistance;
      const next=clamp(startScale*factor,0.00005,100);
      const wx=(startMidX-x)/scale, wy=(startMidY-y)/scale;
      scale=next;
      x=startMidX-wx*scale;
      y=startMidY-wy*scale;
      apply();
      moved=true;
    }
  }else if(e.touches.length===1 && touchMode==="pan"){
    const t=e.touches[0];
    const dx=t.clientX-lastTouchX,dy=t.clientY-lastTouchY;
    if(Math.abs(t.clientX-touchStartX)+Math.abs(t.clientY-touchStartY)>8)moved=true;
    x+=dx;y+=dy;lastTouchX=t.clientX;lastTouchY=t.clientY;apply();
  }
},{passive:false});

stage.addEventListener("touchend",e=>{
  e.preventDefault();
  if(e.touches.length===0){
    if(touchMode==="pan" && moved){
      const dx=(lastTouchX-touchStartX);
      if(Math.abs(dx)>70){
        if(dx<0)showPage(current+1); else showPage(current-1);
      }
    }
    touchMode=null;
  }else if(e.touches.length===1){
    // After pinch, continue as a one-finger pan without jumping.
    touchMode="pan";
    lastTouchX=e.touches[0].clientX;
    lastTouchY=e.touches[0].clientY;
  }
},{passive:false});

window.addEventListener("resize",()=>fit());

document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
document.addEventListener("gestureend",e=>e.preventDefault(),{passive:false});

})();
</script>
</body>
</html>
